[project]
name = "schemewayfinder"
version = "0.1.0"
description = "SchemeWayfinder - multi-agent welfare entitlement navigator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "google-adk>=2.3.0",
    "google-genai>=2.9.0",
    "loguru>=0.7.3",
    "mcp>=1.28.0",
    "pydantic>=2.13.4",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [
  "."
]
norecursedirs = [
  "google-cloud-sdk",
  ".venv",
  "build",
  "dist"
]
